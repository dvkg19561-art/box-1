<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS System PRO</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Kantumruy Pro',sans-serif;transition:.3s}
.light{background:linear-gradient(135deg,#fee2e2,#f1f5f9)}
.dark{background:#0f172a;color:white}
.glass{background:rgba(255,255,255,.9);backdrop-filter:blur(8px)}
.dark .glass{background:rgba(30,41,59,.85)}
.btn{background:linear-gradient(135deg,#dc2626,#b91c1c);color:white}
</style>
</head>
<body class="light">

<div class="max-w-6xl mx-auto p-4">
  <!-- HEADER -->
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-2xl font-bold">POS SYSTEM</h1>
    <button onclick="toggleDark()" class="bg-gray-800 text-white px-4 py-2 rounded-xl">🌙 Dark</button>
  </div>

  <div class="grid md:grid-cols-2 gap-4">
    <!-- LEFT -->
    <div class="space-y-4">
      <div class="glass p-4 rounded-2xl shadow">
        <p>សរុបលក់ថ្ងៃនេះ</p>
        <p id="stat-revenue" class="text-2xl font-bold">0 ៛</p>
      </div>

      <div class="glass p-4 rounded-2xl shadow">
        <form id="add-form" class="space-y-2" onsubmit="addItem(event)">
          <input id="item-name" required placeholder="ឈ្មោះទំនិញ" class="w-full p-2 rounded bg-gray-100 text-black">
          <div class="grid grid-cols-2 gap-2">
            <input id="item-price" type="number" required placeholder="តម្លៃ" class="p-2 rounded bg-gray-100 text-black">
            <input id="item-qty" type="number" value="1" min="1" class="p-2 rounded bg-gray-100 text-black">
          </div>
          <button class="w-full btn py-2 rounded-xl font-bold">+ បន្ថែម</button>
        </form>
      </div>

      <div class="glass p-4 rounded-2xl shadow">
        <h2 class="font-bold mb-2">📊 Daily Sales</h2>
        <canvas id="dailyChart"></canvas>
      </div>

      <div class="glass p-4 rounded-2xl shadow">
        <h2 class="font-bold mb-2">📈 Monthly Sales</h2>
        <canvas id="monthlyChart"></canvas>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="glass p-4 rounded-2xl shadow">
      <h2 class="text-xl font-bold mb-2">វិក្កយបត្រ</h2>
      <div id="items-list" class="space-y-2 text-gray-400">កន្ត្រកទទេ</div>

      <div class="flex justify-between mt-4 font-bold text-lg">
        <span>សរុប</span>
        <span id="total-price">0 ៛</span>
      </div>

      <div class="grid grid-cols-4 gap-2 mt-4">
        <button onclick="checkout()" class="btn py-2 rounded-xl font-bold">✓ ទូទាត់</button>
        <button onclick="printReceipt()" class="bg-slate-800 text-white py-2 rounded-xl">🧾 Print</button>
        <button onclick="openHistory()" class="bg-blue-600 text-white py-2 rounded-xl">📜 History</button>
        <button onclick="clearCart()" class="bg-gray-300 text-black py-2 rounded-xl">សម្អាត</button>
      </div>
    </div>
  </div>
</div>

<!-- HISTORY MODAL -->
<div id="historyModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
  <div class="bg-white w-full max-w-md p-4 rounded-2xl max-h-[80vh] overflow-y-auto">
    <h2 class="text-xl font-bold mb-3 text-center">📜 ប្រវត្តិការទិញ</h2>
    <div id="historyList" class="space-y-3 text-sm"></div>
    <div class="flex gap-2 mt-4">
      <button onclick="closeHistory()" class="flex-1 bg-gray-300 py-2 rounded-xl">បិទ</button>
      <button onclick="clearHistory()" class="flex-1 bg-red-600 text-white py-2 rounded-xl">លុបប្រវត្តិ</button>
    </div>
  </div>
</div>

<script>
let cart=[];
let dailyRevenue=0;
let dailyHistory=JSON.parse(localStorage.getItem("daily_history"))||[];
let monthlySales=JSON.parse(localStorage.getItem("monthly_sales"))||{};
let purchaseHistory=JSON.parse(localStorage.getItem("purchase_history"))||[];
let dailyChart,monthlyChart;

/* DARK MODE */
function toggleDark(){
  document.body.classList.toggle("dark");
  document.body.classList.toggle("light");
}

/* ADD ITEM */
function addItem(e){
  e.preventDefault();
  const name=document.getElementById("item-name").value;
  const price=parseFloat(document.getElementById("item-price").value);
  const qty=parseInt(document.getElementById("item-qty").value);
  cart.push({id:Date.now(), name, price, qty});
  e.target.reset();
  document.getElementById("item-qty").value=1;
  renderCart();
}

/* RENDER CART */
function renderCart(){
  const list=document.getElementById("items-list");
  const totalText=document.getElementById("total-price");
  if(cart.length===0){
    list.innerHTML="កន្ត្រកទទេ";
    totalText.textContent="0 ៛";
    return;
  }
  let total=0;
  list.innerHTML=cart.map(i=>{
    let sub=i.price*i.qty;
    total+=sub;
    return `<div class="flex justify-between bg-gray-100 text-black p-2 rounded">
      <div>${i.name}<br><small>${i.qty} x ${i.price}</small></div>
      <div>${sub}៛</div>
    </div>`;
  }).join("");
  totalText.textContent=total+" ៛";
}

/* CHECKOUT */
function checkout(){
  if(cart.length===0){ alert("គ្មានទំនិញ"); return; }
  let total=cart.reduce((s,i)=>s+i.price*i.qty,0);
  dailyRevenue+=total;
  document.getElementById("stat-revenue").textContent=dailyRevenue+" ៛";

  dailyHistory.push(total);
  localStorage.setItem("daily_history",JSON.stringify(dailyHistory));

  let month=new Date().toISOString().slice(0,7);
  monthlySales[month]=(monthlySales[month]||0)+total;
  localStorage.setItem("monthly_sales",JSON.stringify(monthlySales));

  purchaseHistory.push({time:new Date().toLocaleString('km-KH'), items:[...cart], total});
  localStorage.setItem("purchase_history",JSON.stringify(purchaseHistory));

  cart=[];
  renderCart();
  updateCharts();
  alert("ទូទាត់រួច!");
}

/* PRINT */
function printReceipt(){
  if(cart.length===0){ alert("គ្មានទំនិញ"); return; }
  let total=cart.reduce((s,i)=>s+i.price*i.qty,0);
  let html=`<html><body style="width:80mm;font-family:sans-serif;font-size:12px">
  <h3 style="text-align:center">វិក្កយបត្រ</h3>
  <p>${new Date().toLocaleString('km-KH')}</p>
  <hr>
  ${cart.map(i=>`<div style="display:flex;justify-content:space-between">
    <span>${i.name} x${i.qty}</span>
    <span>${i.price*i.qty}៛</span>
  </div>`).join("")}
  <hr>
  <b style="float:right">សរុប ${total}៛</b>
  <button onclick="window.close()" style="margin-top:10px;width:100%;background:black;color:white">បិទ</button>
  <script>window.onload=function(){window.print()};<\/script>
  </body></html>`;
  let w=window.open("","_blank","width=350,height=600");
  w.document.write(html);
  w.document.close();
}

/* HISTORY */
function openHistory(){
  const modal=document.getElementById("historyModal");
  const list=document.getElementById("historyList");
  if(purchaseHistory.length===0){
    list.innerHTML="<p class='text-center text-gray-500'>គ្មានប្រវត្តិ</p>";
  }else{
    list.innerHTML=purchaseHistory.map((h,i)=>`
      <div class="border p-2 rounded">
        <p class="font-bold text-red-600">លក់ #${i+1}</p>
        <p class="text-xs">${h.time}</p>
        ${h.items.map(it=>`<div>${it.name} x${it.qty} = ${it.price*it.qty}៛</div>`).join("")}
        <b>សរុប ${h.total}៛</b>
      </div>
    `).join("");
  }
  modal.classList.remove("hidden");
}
function closeHistory(){document.getElementById("historyModal").classList.add("hidden");}
function clearHistory(){if(!confirm("លុបទាំងអស់?")) return; purchaseHistory=[]; localStorage.removeItem("purchase_history"); openHistory();}

/* CLEAR CART */
function clearCart(){cart=[]; renderCart();}

/* CHARTS */
function initCharts(){
  dailyChart=new Chart(document.getElementById("dailyChart"),{
    type:"bar",
    data:{labels:dailyHistory.map((_,i)=>"លក់"+(i+1)), datasets:[{label:"Daily",data:dailyHistory,backgroundColor:"#dc2626"}]}
  });
  monthlyChart=new Chart(document.getElementById("monthlyChart"),{
    type:"line",
    data:{labels:Object.keys(monthlySales), datasets:[{label:"Monthly",data:Object.values(monthlySales),borderColor:"#dc2626"}]}
  });
}
function updateCharts(){
  dailyChart.data.labels=dailyHistory.map((_,i)=>"លក់"+(i+1));
  dailyChart.data.datasets[0].data=dailyHistory;
  dailyChart.update();
  monthlyChart.data.labels=Object.keys(monthlySales);
  monthlyChart.data.datasets[0].data=Object.values(monthlySales);
  monthlyChart.update();
}

document.addEventListener("DOMContentLoaded",initCharts);
</script>

</body>
</html>
